name: Client bootstrap
on:
  push:
    branches: [main, 'optimization/**', 'feature/**', 'fix/**']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/client-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
          command -v xvfb-run
          mkdir -p run/mods
          cp libs/sodium-fabric-0.9.2+mc26.3.jar run/mods/
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B || true
      - name: Start client
        run: |
          set +e
          timeout -s TERM 120s xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 gradle --no-daemon --console=plain runClient > client-startup.log 2>&1
          result=$?
          set -e
          echo "Client exit status: $result"
          tail -n 130 client-startup.log
          if grep -Ei 'Mixin apply failed|InvalidMixinException|ClassNotFoundException.*Atmosphere|ClassNotFoundException.*Mixin|Critical injection failure|Failed to apply mixin' client-startup.log; then
            echo 'Client mixin error detected'
            exit 1
          fi
          if grep -Eiq 'Using graphics backend (Vulkan|OpenGL)' client-startup.log; then
            echo 'Minecraft graphics backend started successfully'
          elif grep -Eiq 'Failed to create backend OpenGL|Vulkan is not supported|Couldn.t find matching GLX visual' client-startup.log; then
            echo '::warning title=Graphics backend unavailable::Headless runner cannot validate client rendering'
            echo 'Client render test is INCONCLUSIVE (graphics backend unavailable)'
            exit 0
          else
            echo 'No successful graphics backend initialization detected'
            exit 1
          fi
          if ! grep -q '\[SofronPack\] Atmosphere loaded:' client-startup.log; then
            echo 'Atmosphere module did not finish loading'
            exit 1
          fi
          if ! grep -q 'Sodium terrain lighting initialized' client-startup.log; then
            echo 'Sodium lighting integration did not initialize'
            exit 1
          fi
          if grep -Ei 'Could not create window|NoClassDefFoundError|FATAL EXCEPTION|Crash Report' client-startup.log; then
            echo 'Client startup failure detected'
            exit 1
          fi
          if [ "$result" != 124 ] && [ "$result" != 0 ]; then
            echo 'Client exited before timeout'
            exit 1
          fi
          if ! grep -Eiq 'SofronPack|minecraft|lwjgl|OpenGL' client-startup.log; then
            echo 'No Minecraft startup detected'
            exit 1
          fi
      - name: Upload startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-startup-log
          path: client-startup.log
          if-no-files-found: ignore
