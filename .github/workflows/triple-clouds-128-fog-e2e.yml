name: Triple clouds and 128-chunk fog — in-world smoke
on:
  push:
    branches: ['fix/extended-128-clouds-triple', 'fix/lod-fog-clouds-night-20261121', 'fix/lod-progressive-fog-cloud-gradient', 'fix/shared-four-stage-fog-v0138', 'fix/streamed-lod-v0139', 'fix/distance-dependent-volume-lod-1-2-4', 'feature/near-leaf-models-vanilla-far-lod-20261121', 'feature/packed-instanced-lod-vertical-mips-v0149']
    paths:
      - 'src/**'
      - '.github/workflows/triple-clouds-128-fog-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  textured-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare software graphics device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
          mkdir -p run/mods
          cp libs/sodium-fabric-0.9.2+mc26.3.jar run/mods/
      - name: Build a real Minecraft single-player save
        run: |
          python3 scripts/wild_rice_smoke.py
          mkdir -p run/saves run/config
          cp -a run/sofronpack-wild-rice-smoke run/saves/SofronLodE2E
          printf '{"enabled":true}\n' > run/config/sofronpack-extended-world.json
          printf 'renderDistance:32\nsimulationDistance:5\n' >> run/options.txt
          test -f run/saves/SofronLodE2E/level.dat
      - name: Boot directly into the world with textured LOD enabled
        run: |
          timeout 260s xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 python3 tools/lod_flight_smoke.py
          grep -E 'SofronPack|Voxel LOD|Extended World|Joining|Loading|graphics backend|Exception|ERROR' triple-clouds-128-fog.log | tail -n 95 || true
          if grep -E 'Mixin apply failed|InvalidMixinException|Native Extended World renderer disabled|Extended World GPU preparation failed|Extended World draw disabled|Crash Report' triple-clouds-128-fog.log; then
            echo 'LOADING OR GPU RENDER FAILURE'
            exit 1
          fi
          if ! grep -q '\[SofronPack\] Voxel LOD: restored' triple-clouds-128-fog.log; then
            echo 'Integrated single-player world was not loaded, or voxel cache failed to initialize'
            exit 1
          fi
          if ! grep -Eq 'Near-leaf top/bottom sprites: ([1-9][0-9]*)' triple-clouds-128-fog.log; then
            echo 'Bundled near-leaf detail textures were not resolved in the block atlas'
            exit 1
          fi
          if grep -Ei 'Unable to load model .*leaves|Could not load model .*leaves|Unable to load texture .*leaves_(top|bottom)' triple-clouds-128-fog.log; then
            echo 'One or more near-leaf models or textures were rejected'
            exit 1
          fi
          if ! grep -q 'Textured Extended World GPU draw issued' triple-clouds-128-fog.log; then
            echo 'The 128-chunk, fogged GPU render hook was not reached while in the world'
            exit 1
          fi
          grep -Fq 'Sodium terrain fog range confirmed at 2048 blocks' triple-clouds-128-fog.log
          if ! grep -q 'Unified Extended World fog active' triple-clouds-128-fog.log; then
            echo 'The shared normal-chunk + LOD fog mixin was not activated'
            exit 1
          fi
          if ! grep -q 'Cloud bands active at Y=256,384,512' triple-clouds-128-fog.log; then
            echo 'The three-layer cloud renderer was not activated'
            exit 1
          fi
          if grep -iE 'shader compilation failed|failed to compile shader|Extended World draw disabled|could not compile.*extended_voxel' triple-clouds-128-fog.log; then
            echo 'Native 128-chunk fog shader failed to compile or render'
            exit 1
          fi
          echo 'PASS: native LOD GPU rendering and 256/384/512 cloud bands in-world'
      - name: Keep the actual in-world startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-clouds-128-fog-in-world-log
          path: |
            triple-clouds-128-fog.log
            wild-rice-smoke.log
            lod-*.png
          if-no-files-found: ignore
