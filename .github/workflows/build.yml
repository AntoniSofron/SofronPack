name: Build
on:
  push:
    branches: [main, 'optimization/**', 'feature/**', 'fix/**']
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'libs/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/verify_jar.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate
        run: |
          python3 scripts/verify_single_notice.py
          python3 scripts/validate_design.py
          python3 scripts/validate_implementation.py
          python3 scripts/validate_willow_templates.py
      - name: Compile
        run: |
          gradle --no-daemon clean build --stacktrace
          python3 scripts/check_grounded_mountains.py
      - name: Verify JAR
        run: python3 tools/verify_jar.py
      - name: Stage the freshly compiled JAR
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)
          mkdir -p dist
          cp "build/libs/26.3-SofronPack-v${version}.jar" dist/
      - name: Test wild rice
        timeout-minutes: 9
        run: python3 scripts/wild_rice_smoke.py
      - name: Debug logs
        if: failure()
        run: |
          if [ -f wild-rice-smoke.log ]; then tail -n 150 wild-rice-smoke.log; fi
          if [ -f run/logs/latest.log ]; then tail -n 150 run/logs/latest.log; fi
      - name: Read version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: 26.3-SofronPack-v${{ steps.version.outputs.version }}
          path: dist/26.3-SofronPack-v${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
      - name: Archive JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/*.jar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "JAR v${{ steps.version.outputs.version }}"
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
