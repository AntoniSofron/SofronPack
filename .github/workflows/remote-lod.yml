name: Multiplayer LOD storage
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/main/java/pl/sofron/extended/client/RemoteLodCache.java'
      - '.github/workflows/remote-lod.yml'
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Join a dedicated server and check both disks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
          mkdir -p run/config run/mods run-server/config
          cp libs/sodium-*.jar run/mods/
          echo '{"enabled":true}' | tee run/config/sofronpack-extended-world.json > run-server/config/sofronpack-extended-world.json
          echo 'eula=true' > run-server/eula.txt
          printf 'online-mode=false\nview-distance=4\nsimulation-distance=3\n' > run-server/server.properties
          printf 'renderDistance:4\n' > run/options.txt
          echo "tasks.named('runServer') { workingDir = file('run-server') }" >> build.gradle
          gradle --console=plain runServer > server.log 2>&1 &
          for i in {1..120}; do
            grep -q 'Done (' server.log && break
            sleep 2
          done
          grep -q 'Done (' server.log
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 gradle --console=plain runClient --args='--quickPlayMultiplayer localhost:25565' > client.log 2>&1 &
          for i in {1..120}; do
            if test -d run/sofronpack-cache && find run/sofronpack-cache -name '*.voxel.v4.bin' -size +8c | grep -q .; then break; fi
            sleep 2
          done
          find run/sofronpack-cache -name '*.voxel.v4.bin' -size +8c | grep .
          test -f run-server/world/level.dat
          test -z "$(find run-server \( -name 'sofronpack-extended-world' -o -name '*.voxel.v4.bin' -o -name lod-mesh-v1 \) -print -quit)"
      - name: Show diagnostics
        if: failure()
        run: tail -n 100 server.log client.log
