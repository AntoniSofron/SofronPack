name: Import Gen + Light into one SofronPack
on:
  push:
    paths:
      - '.github/workflows/import-legacy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Clone original source repositories (read-only)
        run: |
          git clone --depth 1 --branch main https://github.com/AntoniSofron/SofronPackGen.git "$RUNNER_TEMP/SofronPackGen"
          git clone --depth 1 --branch main https://github.com/AntoniSofron/SofronPackLight.git "$RUNNER_TEMP/SofronPackLight"
      - name: Combine complete source trees into one Fabric mod
        run: |
          python3 tools/import_legacy.py --gen "$RUNNER_TEMP/SofronPackGen" --light "$RUNNER_TEMP/SofronPackLight"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('src/main/resources')
          m=json.loads((p/'fabric.mod.json').read_text())
          assert m['id']=='sofronpack' and len(m['entrypoints']['main'])==2 and len(m['entrypoints']['client'])==2
          assert len(m['mixins'])==2
          assert (p/'assets/sofronpack/shaders/blocks/block_layer_opaque.fsh').exists()
          assert (p/'assets/sofronpack/blockstates/rice_crop.json').exists()
          assert (p/'data/sofronpack/structure/swamp_willow_5.nbt').exists()
          assert pathlib.Path('libs/sodium-fabric-0.9.2+mc26.3.jar').exists()
          PY
      - name: Commit imported sources (even if build later fails)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- src config design docs gradle scripts libs LICENSE BUILD.bat BUILD_AND_INSTALL.bat
          git commit -m "Import all Gen and Light files into one sofronpack namespace"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate imported Gen world generation
        run: |
          python3 scripts/validate_design.py
          python3 scripts/validate_implementation.py
          python3 scripts/validate_willow_templates.py
      - name: Compile one SofronPack JAR containing both components
        run: |
          gradle --no-daemon clean build --stacktrace
          python3 scripts/check_grounded_mountains.py
      - name: Inspect single JAR and stage immutable versioned artifact
        run: python3 tools/verify_jar.py
      - uses: actions/upload-artifact@v4
        with:
          name: 26.3-SofronPack-v0.1.0
          path: dist/26.3-SofronPack-v0.1.0.jar
          if-no-files-found: error
          retention-days: 30
      - name: Save .jar permanently to dist/
        run: |
          git add -- dist/*.jar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 26.3-SofronPack-v0.1.0.jar"
          git pull --rebase origin main
          git push origin HEAD:main
